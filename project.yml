# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: GymLog
options:
  bundleIdPrefix: com.deborahdore
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""   # your Team ID (Xcode > Settings > Accounts), so signing survives regeneration
targets:
  GymLog:
    type: application
    platform: iOS
    scheme: {}
    sources: [Shared, GymLog]
    info:
      path: GymLog/Info.plist
      properties:
        CFBundleDisplayName: GymLog
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deborahdore.GymLog
    dependencies:
      - target: GymLogWatch

  GymLogWatch:
    type: application
    platform: watchOS
    sources: [Shared, GymLogWatch]
    info:
      path: GymLogWatch/Info.plist
      properties:
        CFBundleDisplayName: GymLog
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.deborahdore.GymLog
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: GymLog runs a workout session so the rest timer keeps working with your wrist down.
        NSHealthUpdateUsageDescription: GymLog saves your strength workouts to Health.
    entitlements:
      path: GymLogWatch/GymLogWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deborahdore.GymLog.watchkitapp
    dependencies:
      - target: GymLogWidget

  GymLogWidget:
    type: app-extension
    platform: watchOS
    sources: [GymLogWidget]
    info:
      path: GymLogWidget/Info.plist
      properties:
        CFBundleDisplayName: GymLog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deborahdore.GymLog.watchkitapp.widget
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
